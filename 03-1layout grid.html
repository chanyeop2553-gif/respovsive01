<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            body {
                background-color: aqua;
            }
            #container {
                width: 1200px;
                margin: 0 auto;
            }
            #header {
                width: 100%;
                height: 100px;
                background-color: azure;
            }
            #nav {
                width: 100%;
                height: 100px;
                background-color: red;
            }
            #main {
                width: 100%;
                display: grid;
                grid-template-areas: 
                "aside article1"
                "aside article2"
                "aside article3";

                grid-template-columns: 30% 70%;
                grid-template-rows: 260px 260px 260px;
            }
            #aside {
              grid-area:aside;
              background-color: crimson;
            }
            #article1{
            grid-area:article1;
            background-color: brown;
            }
            #article2{
            grid-area:article2;
            background-color: chartreuse;
            }
            #article3{
            grid-area:article3;
            background-color: chocolate;
            }
            #footer {
                width: 100%;
                height: 100px;
                background-color: chocolate;
            }
            
            /* 미디어 쿼리 */
            /* 노트북, 데스크탑 */
            @media (max-width: 1300px) {
              #container {
                    width: 90%;
                
              }

                #main {
                grid-template-areas: 
                "aside article1 article1"
                "aside article2 article3";

                grid-template-columns: 30% 35% 35%;
                grid-template-rows: 260px 520px;
                }
              }

            /* 테블릿 */
            @media (max-width: 768px) {
              #container {
                  width: 100%;
                }
                #main {
                grid-template-areas: 
                "aside article1"
                "aside article2";

                grid-template-columns: 30% 70%;
                grid-template-rows: 390px 390px;
                }
                #article3{
                  display: none;
                }
            }

            /* 모바일 */
            @media (max-width: 480px) {
            #main {
                grid-template-areas: 
                "aside" 
                "article1"
                "article2";

                grid-template-columns: 100%;
                grid-template-rows: 200px 430px 150px;
                }
              }

        </style>
    </head>
    <body>
        <div id="container">
            <div id="header">header</div>
            <div id="nav">nav</div>
            <div id="main">
                <div id="aside"></div>
                    <div id="article1">article1</div>
                    <div id="article2">article2</div>
                    <div id="article3">article3</div>
                    </div>
                </div>
            </div>
            <div id="footer">footer</div>
        </div>
    </body>
</html>
