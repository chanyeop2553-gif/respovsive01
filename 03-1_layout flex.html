<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            body {
                background-color: aqua;
            }
            #container {
                width: 1200px;
                margin: 0 auto;
            }
            #header {
                width: 100%;
                height: 100px;
                background-color: azure;
            }
            #nav {
                width: 100%;
                height: 100px;
                background-color: red;
            }
            #main {
                width: 100%;
                display: flex;
                flex-wrap: wrap;
            }
            #aside {
                width: 30%;
                height: 780px;
                background-color: blue;
            }
            #article {
                width: 70%;
            }
            #article #article1 {
                width: 100%;
                height: 260px;
                background-color: yellow;
            }

            #article #article2_inner {
                width: 100%;
            }

            #article #article2_inner #article2-1 {
                width: 100%;
                height: 260px;
                background-color: green;
            }
            #article #article2_inner #article2-2 {
                width: 100%;
                height: 260px;
                background-color: yellowgreen;
            }
            #footer {
                width: 100%;
                height: 100px;
                background-color: chocolate;
            }
            /* 미디어 쿼리 */
            /* 노트북, 데스크탑 */
            @media (max-width: 1300px) {
                #container {
                    width: 90%;
                }
                #article #article2_inner {
                    display: flex;
                }
                #article #article2_inner #article2-1 {
                    width: 50%;
                    height: 520px;
                }
                #article #article2_inner #article2-2 {
                    width: 50%;
                    height: 520px;
                }
            }

            /* 테블릿 */
            @media (max-width: 768px) {
                #container {
                    width: 100%;
                }
                #article #article1 {
                    height: 390px;
                }
                #article #article2_inner #article2-1 {
                    width: 100%;
                    height: 390px;
                }
                #article #article2_inner #article2-2 {
                    display: none;
                }
            }

            /* 모바일 */
            @media (max-width: 480px) {
                #aside {
                    width: 100%;
                    height: 200px;
                }
                #article {
                    width: 100%;
                }
                #article #article1 {
                    height: 200px;
                }
                #article #article2_inner #article2-1 {
                    height: 430px;
                }
            }
        </style>
    </head>
    <body>
        <div id="container">
            <div id="header"><header></header></div>
            <div id="nav">nax</div>
            <div id="main">
                <div id="aside"></div>
                <div id="article">
                    <div id="article1">article1</div>
                    <div id="article2_inner">
                        <div id="article2-1">1111</div>
                        <div id="article2-2">2222</div>
                    </div>
                </div>
            </div>
            <div id="footer"></div>
        </div>
    </body>
</html>
