<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            body {
                background-color: aqua;
            }
            #container {
                width: 1200px;
                margin: 0 auto;
            }
            #header {
                width: 100%;
                height: 100px;
                background-color: azure;
            }
            #nav {
                width: 100%;
                height: 100px;
                background-color: red;
            }
            #main {
                width: 100%;
                display: flex;
                flex-wrap: wrap;
            }
            #aside {
                width: 25%;
                height: 100px;
                background-color: blue;
            }
            #section {
                width: 50%;
                height: 100px;
                background-color: green;
            }
            #article {
                width: 25%;
                height: 100px;
                background-color: yellow;
            }
            #footer {
                width: 100%;
                height: 100px;
                background-color: chocolate;
            }

            /* 미디어 쿼리 */
            /* 노트북, 데스크탑 */
            @media (max-width: 1300px) {
                #container {
                    width: 90%;
                }
            }

            /* 테블릿 */
            @media (max-width: 768px) {
                #container {
                    width: 100%;
                }
                #aside {
                    width: 40%;
                    height: 630px;
                }
                #section {
                    width: 60%;
                    height: 630px;
                }
                #article {
                    width: 100%;
                    height: 150px;
                }
            }
            /* 모바일 */
            @media (max-width: 480px) {
                #aside {
                    width: 100%;
                    height: 200px;
                }
                #section {
                    width: 100%;
                    height: 430px;
                }
            }
        </style>
    </head>
    <body>
        <div id="containr">
            <header id="header"></header>
            <nav id="mav"></nav>
            <main id="main">
                <aside id="aside"></aside>
                <section id="section"></section>
                <article id="article"></article>
            </main>
            <footer id="footer"></footer>
        </div>
    </body>
</html>
